# fuzzel, styled like macOS Spotlight with the Catppuccin Mocha colours (man fuzzel.ini).
# Open it with Super+P; type to search apps, Enter to launch, Esc to close.
[main]
font=Inter:size=13
prompt=" "
placeholder=Search
icons-enabled=yes
anchor=center
width=44
lines=8
horizontal-pad=20
vertical-pad=16
inner-pad=12
line-height=26
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=1e1e2ef2
text=cdd6f4ff
placeholder=6c7086ff
prompt=cba6f7ff
input=cdd6f4ff
match=cba6f7ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=6c7086ff
border=cba6f7aa

[border]
width=1
radius=16
