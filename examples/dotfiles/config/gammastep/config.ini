; gammastep, the night light (man gammastep): warmer colours after sunset.
; Started by rivermonad.hs; Super+Shift+N switches it off and on.
; Needs an output that supports gamma (real hardware; not virtio-gpu VMs).
[general]
temp-day=6500
temp-night=4000
fade=1
; where you are, from GeoClue (rivermonad.hs starts its agent); or set it:
;   location-provider=manual   and a [manual] section with lat= and lon=
location-provider=geoclue2
adjustment-method=wayland
